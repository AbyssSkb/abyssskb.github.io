        let filteredCourses = courses;

        function createDifficultyStars(difficulty) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<i class="fas fa-star difficulty-star ${i <= difficulty ? '' : 'empty'}"></i>`;
            }
            return stars;
        }

        function createCourseCard(course) {
            const prerequisites = course.prerequisites.map(p => 
                `<span class="prerequisite-tag">${p}</span>`
            ).join('');

            return `
                <div class="course-card" data-category="${course.category}" data-title="${course.title.toLowerCase()}">
                    <div class="course-category">${getCategoryName(course.category)}</div>
                    <h3 class="course-title">${course.title}</h3>
                    <p class="course-description">${course.description}</p>
                    <div class="course-meta">
                        <div class="course-difficulty">
                            ${createDifficultyStars(course.difficulty)}
                        </div>
                        <div class="course-count">${course.articleCount} 篇文章</div>
                    </div>
                    <div class="course-prerequisites">
                        <span>前置要求：</span>
                        ${prerequisites}
                    </div>
                    <div class="course-action">
                        <button class="start-course-btn" onclick="startCourse('${course.id}')">开始学习</button>
                    </div>
                </div>
            `;
        }

        function getCategoryName(category) {
            const names = {
                'mathematics': '数学',
                'physics': '物理学',
                'computer-science': '计算机科学',
                'system': '系统管理'
            };
            return names[category] || category;
        }

        function renderCourses(coursesToRender = filteredCourses) {
            const grid = document.getElementById('coursesGrid');
            const noResults = document.getElementById('noResults');
            
            if (coursesToRender.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
            } else {
                grid.innerHTML = coursesToRender.map(createCourseCard).join('');
                noResults.style.display = 'none';
            }
        }

        function filterCourses(category) {
            if (category === 'all') {
                filteredCourses = courses;
            } else {
                filteredCourses = courses.filter(course => course.category === category);
            }
            renderCourses();
        }

        function searchCourses(query) {
            const searchTerm = query.toLowerCase().trim();
            if (searchTerm === '') {
                renderCourses(filteredCourses);
            } else {
                const searchResults = filteredCourses.filter(course => 
                    course.title.toLowerCase().includes(searchTerm) ||
                    course.description.toLowerCase().includes(searchTerm) ||
                    course.prerequisites.some(p => p.toLowerCase().includes(searchTerm))
                );
                renderCourses(searchResults);
            }
        }

        function startCourse(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (course) {
                // Create course detail page URL
                window.location.href = `/courses/${courseId}/`;
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Render initial courses
            renderCourses();

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    filterCourses(this.dataset.category);
                });
            });

            // Search functionality
            const searchInput = document.getElementById('courseSearch');
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchCourses(this.value);
                }, 300);
            });
        });
    </script>
</body>
</html>
